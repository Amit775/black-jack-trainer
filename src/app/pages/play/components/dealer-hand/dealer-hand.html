<div class="dealer-section">
  <div class="dealer-area">
    <div class="hand-label">
      <span class="dealer-label">Dealer</span>
      @if (shouldShowValue()) {
        <div class="hand-value-container" [class.blackjack]="hasBlackjack()">
          @if (hasBlackjack()) {
            <span class="blackjack-badge">BLACKJACK!</span>
          } @else {
            <span class="hand-value">{{ handValue() }}</span>
          }
        </div>
      }
    </div>
    <div class="cards-row dealer-cards">
      @for (card of hand().cards; track card.id; let i = $index) {
        <app-playing-card
          [card]="card"
          [size]="'large'"
          (enterComplete)="onCardEnterComplete($event)"
          (revealComplete)="onCardRevealComplete($event)"
          [class.hole-card]="i === 1 && !card.faceUp"
        />
      } @empty {
        <div class="empty-hand-placeholder">
          <span class="placeholder-text">Waiting for deal...</span>
        </div>
      }
    </div>
  </div>
</div>
