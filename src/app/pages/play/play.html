<div class="play-container">
  <!-- Game Header -->
  <app-game-header [balance]="store.balance()" (settingsClicked)="openSettings()" />

  <div class="game-table">
    <!-- Table Accessories (Shoe & Discard Tray) -->
    <app-table-accessories
      [shoeState]="store.shoeState()"
      [cardsInShoe]="store.shoe().length"
      [discardTray]="store.discardTray()"
    />

    <!-- Dealer Section -->
    <app-dealer-hand
      [hand]="store.dealerHand()"
      [handValue]="store.dealerHandValue()"
      (cardEntered)="onCardAnimationComplete($event)"
      (cardRevealed)="onCardAnimationComplete($event)"
    />

    <!-- Game Message -->
    <div class="game-message">
      <span
        [class.win]="store.result() === 'win' || store.result() === 'blackjack'"
        [class.lose]="store.result() === 'lose'"
        [class.push]="store.result() === 'push'"
      >
        {{ store.message() }}
      </span>
    </div>

    <!-- Player Boxes Carousel -->
    <app-carousel
      [activeIndex]="activeCarouselIndex()"
      [indicators]="carouselIndicators()"
      (activeIndexChange)="onCarouselIndexChange($event)"
    >
      @for (item of carouselItems(); track item.position + '-' + item.handIndex) {
        <ng-template carouselItem>
          @if (getBox(item.position); as box) {
            @if (box.isActive) {
              <app-player-box
                [box]="box"
                [gamePhase]="store.phase()"
                [isActiveBox]="isActiveBox(item.position)"
                [isInsuranceBox]="isInsuranceBox(item.position)"
                [isSelectedBox]="true"
                [activeHandIndex]="item.handIndex"
                [showOnlyHandIndex]="item.isSplitHand ? item.handIndex : -1"
                (boxSelected)="onBoxSelected($event)"
                (chipRemoved)="onChipRemoved($event)"
                (boxRemoved)="onBoxRemoved($event)"
                (cardAnimationComplete)="onCardAnimationComplete($event)"
              />
            } @else if (store.phase() === 'betting') {
              <button
                class="add-box-btn"
                mat-fab
                (click)="onToggleBox(item.position)"
              >
                <mat-icon>add</mat-icon>
              </button>
            }
          }
        </ng-template>
      }
    </app-carousel>

    <!-- Chip Rack -->
    @if (store.phase() === 'betting') {
      <app-chip-rack
        [balance]="store.balance()"
        [currentTotalBet]="store.currentBet()"
        (chipSelected)="onChipSelected($event)"
      />
    }
  </div>

  <!-- Game Controls -->
  <app-game-controls
    [phase]="store.phase()"
    [totalBet]="store.currentBet()"
    [controlsState]="controlsState()"
    [insuranceBox]="store.insuranceBox()"
    (actionTriggered)="onActionTriggered($event)"
  />
</div>
